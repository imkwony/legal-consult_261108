<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>법률 상담</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">⚖️ 법률 상담</h1>
    <nav class="actions">
      <button id="btn-new" type="button">새 상담</button>
      <button id="btn-load" type="button">불러오기</button>
      <div class="dropdown">
        <button id="btn-download" type="button" aria-haspopup="true" aria-expanded="false">다운로드 ▾</button>
        <div id="download-menu" class="menu" hidden>
          <button type="button" data-format="md">Markdown (.md)</button>
          <button type="button" data-format="docx">Word (.docx)</button>
          <button type="button" data-format="pdf">PDF (인쇄 → PDF로 저장)</button>
        </div>
      </div>
      <button id="btn-features" type="button">기능 안내</button>
      <button id="btn-settings" type="button" class="primary">설정</button>
    </nav>
  </header>

  <main id="chat" class="chat">
    <section id="welcome" class="welcome">
      <h2>무엇이든 편하게 물어보세요</h2>
      <p>국가법령정보센터의 실제 법 조문과 판례를 찾아본 뒤, 근거와 함께 쉽게 설명해 드립니다.</p>
      <p class="hint">받은 소장이 있으면 내용을 붙여넣거나 📎 버튼으로 PDF를 올려 주세요.</p>
      <div class="examples">
        <button type="button" class="example">소송을 당했는데 답변서는 어떻게 써야 하나요?</button>
        <button type="button" class="example">이 정도 소송이면 변호사를 꼭 선임해야 하나요?</button>
        <button type="button" class="example">빌려준 돈을 안 갚을 때 비슷한 판례는 어떻게 끝났나요?</button>
      </div>
    </section>
    <div id="messages"></div>
  </main>

  <footer class="composer">
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <div id="attachments" class="attachments"></div>
    <form id="form" class="form">
      <label class="attach" title="PDF 첨부">
        📎<span class="sr">PDF 첨부</span>
        <input id="file" type="file" accept="application/pdf,.pdf" hidden>
      </label>
      <textarea id="input" rows="2" placeholder="질문을 입력하세요"></textarea>
      <button id="send" type="submit" class="primary">보내기</button>
    </form>
  </footer>

  <dialog id="dlg-settings" class="dialog">
    <form method="dialog" id="settings-form">
      <h2>설정</h2>
      <label>구글 스크립트 주소 <span class="req">(필수)</span>
        <input id="set-script" type="url" placeholder="https://script.google.com/macros/s/.../exec" required>
      </label>
      <label>내 BAZE API 키 <span class="opt">(선택 — 비워두면 기본 키 사용)</span>
        <input id="set-key" type="password" autocomplete="off" placeholder="비워두셔도 됩니다">
      </label>
      <label>AI 모델
        <input id="set-model" type="text">
      </label>
      <p class="hint">설정은 이 기기의 브라우저에만 저장됩니다. 휴대폰에서는 한 번 더 입력해 주세요.</p>
      <div class="row">
        <button value="cancel" type="button" id="settings-cancel">취소</button>
        <button value="save" class="primary" id="settings-save">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-load" class="dialog">
    <h2>지난 상담 불러오기</h2>
    <div id="load-list" class="list">불러오는 중…</div>
    <div class="row"><button type="button" data-close>닫기</button></div>
  </dialog>

  <dialog id="dlg-features" class="dialog wide">
    <h2>이 상담에서 쓰는 기능</h2>
    <p class="hint">질문만 하시면 AI가 아래 기능 중 필요한 것을 골라 국가법령정보센터 자료를 찾아봅니다.</p>
    <div id="features-list" class="list">불러오는 중…</div>
    <div class="row"><button type="button" data-close>닫기</button></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
